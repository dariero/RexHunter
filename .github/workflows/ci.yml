# Structural backstop for the solo direct-to-main workflow: the check that
# `git push --no-verify` cannot bypass. Pair with GitHub branch protection on
# `main` requiring this job. NOTE: not run locally — verify on first push.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # NOTE: this list mirrors pyproject.toml [project.dependencies] + the dev tools by hand —
      # it drifts on every new dependency (httpx was added in P5 Unit 2a). Keep it in sync.
      - run: pip install ruff pyright pytest hypothesis fastapi uvicorn aiosqlite pydantic httpx
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: |
          if ls tests/test_*.py >/dev/null 2>&1; then pytest -q; else echo "no tests yet"; fi
