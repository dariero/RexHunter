# Structural backstop for the branch + PR workflow: the check that
# `git push --no-verify` cannot bypass. Pair with GitHub branch protection on
# `main` requiring this job. It installs exactly what uv.lock pins — the same
# versions the local pre-push gate runs — and `--locked` fails if the lock is stale.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked --python 3.15
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
