[project]
name = "rexhunter"
version = "0.1.0"
description = "Local-first autonomous job-hunting agent on a 'terrarium' model."
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "aiosqlite>=0.22.1",
    "pydantic>=2.14.3",
    "httpx>=0.28.1",
    "anthropic>=2.6.0",
    "certifi>=2026.10.23",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    # [nodejs]: pyright runs on a lockfile-pinned Node (nodejs-wheel-binaries), never the
    # machine's — an old global Node fails to parse this file and pyright exits 3.
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2",
    "hypothesis>=6.170.15",  # property-based DoD for the projection reducer (view.py)
    # Async tests via anyio's pytest plugin (ships with starlette); no extra dep.
]

[tool.uv]
# App, not a package: uv owns env + lock, never builds.
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ASYNC: guards the hand-rolled async loop.
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
exclude = [".venv", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
