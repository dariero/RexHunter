[project]
name = "rexhunter"
version = "0.1.0"
description = "Local-first autonomous job-hunting agent on a 'terrarium' model."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136",
    "uvicorn>=0.49",
    "aiosqlite>=0.20",
    "pydantic>=2.13",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.400",
    "pytest>=8",
    # Async tests use anyio's built-in pytest plugin (anyio ships with starlette);
    # no pytest-anyio / pytest-asyncio dependency.
]

[tool.uv]
# Application, not a distributable package: uv manages env + lockfile, never builds.
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ASYNC rules are load-bearing for the hand-rolled agent loop.
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
exclude = [".venv", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
